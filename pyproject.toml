[project]
name = "multi-agent-data-analyst"
version = "0.1.0"
description = "Autonomous multi-agent data analyst powered by LangGraph, Groq, and Streamlit"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Streamlit runs app/main.py as a script, so it adds the project root to sys.path before importing.
"app/main.py" = ["E402"]
"evaluation/*.py" = ["E402"]
