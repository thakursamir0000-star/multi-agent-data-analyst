name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional; enables the end-to-end benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (sandbox in process-isolation mode)
        run: pytest -q
      - name: Benchmark ground truth (no LLM)
        run: python evaluation/benchmark.py --dry-run
      - name: End-to-end benchmark (Groq)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python evaluation/benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: evaluation/results/
          if-no-files-found: ignore
