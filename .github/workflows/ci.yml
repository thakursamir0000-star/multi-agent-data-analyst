name: CI

on:
  push:
  pull_request:
  # The LLM benchmark spends Groq quota (a full run uses a large share of the
  # free daily allowance), so it runs on demand and weekly, not on every push.
  workflow_dispatch:
    inputs:
      model:
        description: Groq model to benchmark (each model has its own daily quota)
        type: choice
        default: openai/gpt-oss-120b
        options:
          - openai/gpt-oss-120b
          - openai/gpt-oss-20b
          - llama-3.3-70b-versatile
          - llama-3.1-8b-instant
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "py3.11, pandas 2, duckdb 1"
            python: "3.11"
            # Each spec is single-quoted: unquoted, the shell reads "<3" and ">=" as redirects.
            pins: "'pandas>=2.2,<3' 'duckdb>=1.1,<2'"
          - label: "py3.12, latest"
            python: "3.12"
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt ${{ matrix.pins }}
      - name: Lint
        run: ruff check .
      - name: Test (sandbox in process-isolation mode)
        run: pytest -q
      - name: Benchmark ground truth (no LLM)
        run: python evaluation/benchmark.py --dry-run

  benchmark:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional; the steps are skipped without it
      MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: ${{ env.GROQ_API_KEY != '' }}
        run: pip install -r requirements.txt
      - name: End-to-end benchmark (Groq)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: python evaluation/benchmark.py --model "$MODEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: evaluation/results/
          if-no-files-found: ignore
