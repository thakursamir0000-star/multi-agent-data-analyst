name: CI

on:
  push:
  pull_request:
  # The LLM benchmark spends Groq quota (a full run uses a large share of the
  # free daily allowance), so it runs on demand and weekly, not on every push.
  workflow_dispatch:
    inputs:
      model:
        description: Groq model to benchmark ("compare-all" runs all three; each model has its own daily quota)
        type: choice
        default: openai/gpt-oss-120b
        options:
          - openai/gpt-oss-120b
          - openai/gpt-oss-20b
          - qwen/qwen3.8-27b
          - compare-all
      repeats:
        description: Runs per question (more runs show how much answers vary, but cost more quota)
        type: choice
        default: "1"
        options: ["1", "2", "3"]
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "py3.11, pandas 2, duckdb 1"
            python: "3.11"
            # Each spec is single-quoted: unquoted, the shell reads "<3" and ">=" as redirects.
            pins: "'pandas>=2.2,<3' 'duckdb>=1.1,<2'"
          - label: "py3.12, latest"
            python: "3.12"
            pins: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt ${{ matrix.pins }}
      - name: Lint
        run: ruff check .
      - name: Test (sandbox in process-isolation mode)
        run: pytest -q
      - name: Benchmark ground truth (no LLM)
        run: python evaluation/benchmark.py --dry-run

  docker:
    name: docker (MCP server over HTTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t agentai-mcp .
      - name: Start container
        run: docker run -d --name mcp -p 8000:8000 agentai-mcp
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the MCP client
        run: pip install "mcp>=2.2,<3"
      - name: Smoke-test the container with a real MCP client
        run: python -m mcp_server.smoke http://127.0.0.1:8000/mcp
      - name: Container health and logs
        if: always()
        run: |
          docker inspect --format 'health: {{.State.Health.Status}}' mcp || true
          docker logs mcp

  benchmark:
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional; the steps are skipped without it
      MODEL: ${{ inputs.model || 'openai/gpt-oss-120b' }}
      REPEATS: ${{ inputs.repeats || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: ${{ env.GROQ_API_KEY != '' }}
        run: pip install -r requirements.txt
      - name: End-to-end benchmark (Groq)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: |
          if [ "$MODEL" = "compare-all" ]; then
            MODELS="openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b"
          else
            MODELS="$MODEL"
          fi
          python evaluation/benchmark.py --models "$MODELS" --repeats "$REPEATS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: evaluation/results/
          if-no-files-found: ignore
